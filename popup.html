<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepoPeek</title>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>RepoPeek</h1>
            <p class="subtitle">Share private repos securely</p>
        </div>

        <!-- Login Section (shown when not logged in) -->
        <div id="login-section" class="section">
            <p class="info-text">Login with GitHub to start sharing private repositories</p>
            <button id="login-btn" class="btn btn-primary">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                </svg>
                Login with GitHub
            </button>
        </div>

        <!-- Main Section (shown when logged in) -->
        <div id="main-section" class="section hidden">
            <!-- User Info -->
            <div class="user-info">
                <img id="user-avatar" src="" alt="Avatar" class="avatar">
                <div class="user-details">
                    <div id="user-name" class="user-name">Loading...</div>
                    <button id="logout-btn" class="btn-link">Logout</button>
                </div>
            </div>

            <!-- Current Repo Info -->
            <div class="repo-info">
                <div class="repo-label">Current Repository:</div>
                <div id="repo-name" class="repo-name">-</div>
            </div>

            <!-- Expiry Settings -->
            <div class="expiry-settings">
                <label for="expiry-days" class="expiry-label">Link expires in:</label>
                <div class="expiry-input-group">
                    <input 
                        type="number" 
                        id="expiry-days" 
                        class="expiry-input" 
                        value="7" 
                        min="1" 
                        max="30"
                    >
                    <span class="expiry-unit">days</span>
                </div>
            </div>

            <!-- Generate Link Button -->
            <button id="generate-link-btn" class="btn btn-primary" disabled>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M7.775 3.275a.75.75 0 001.06 1.06l1.25-1.25a2 2 0 112.83 2.83l-2.5 2.5a2 2 0 01-2.83 0 .75.75 0 00-1.06 1.06 3.5 3.5 0 004.95 0l2.5-2.5a3.5 3.5 0 00-4.95-4.95l-1.25 1.25zm-4.69 9.64a2 2 0 010-2.83l2.5-2.5a2 2 0 012.83 0 .75.75 0 001.06-1.06 3.5 3.5 0 00-4.95 0l-2.5 2.5a3.5 3.5 0 004.95 4.95l1.25-1.25a.75.75 0 00-1.06-1.06l-1.25 1.25a2 2 0 01-2.83 0z"></path>
                </svg>
                Generate Share Link
            </button>

            <!-- Loading State -->
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Creating shareable link...</p>
            </div>

            <!-- Success State -->
            <div id="success-section" class="success-section hidden">
                <svg class="success-icon" width="48" height="48" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M13.78 4.22a.75.75 0 010 1.06l-7.25 7.25a.75.75 0 01-1.06 0L2.22 9.28a.75.75 0 011.06-1.06L6 10.94l6.72-6.72a.75.75 0 011.06 0z"></path>
                </svg>
                <p class="success-text">Link created successfully!</p>
                
                <div class="link-container">
                    <input 
                        type="text" 
                        id="share-link" 
                        readonly 
                        class="link-input"
                    >
                    <button id="copy-btn" class="btn btn-secondary">
                        Copy
                    </button>
                </div>

                <div class="expiry-info">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Zm7-3.25v2.992l2.028.812a.75.75 0 0 1-.557 1.392l-2.5-1A.751.751 0 0 1 7 8.25v-3.5a.75.75 0 0 1 1.5 0Z"></path>
                    </svg>
                    Expires: <span id="expiry-date"></span>
                </div>

                <button id="revoke-btn" class="btn btn-secondary revoke-btn hidden">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"></path>
                    </svg>
                    Revoke Link
                </button>
            </div>

            <!-- Error State -->
            <div id="error-section" class="error-section hidden">
                <svg class="error-icon" width="48" height="48" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M2.343 13.657A8 8 0 1 1 13.658 2.343 8 8 0 0 1 2.343 13.657ZM6.03 4.97a.751.751 0 0 0-1.042.018.751.751 0 0 0-.018 1.042L6.94 8 4.97 9.97a.749.749 0 0 0 .326 1.275.749.749 0 0 0 .734-.215L8 9.06l1.97 1.97a.749.749 0 0 0 1.275-.326.749.749 0 0 0-.215-.734L9.06 8l1.97-1.97a.749.749 0 0 0-.326-1.275.749.749 0 0 0-.734.215L8 6.94Z"></path>
                </svg>
                <p id="error-message" class="error-text"></p>
                <button id="retry-btn" class="btn btn-secondary">
                    Try Again
                </button>
            </div>
        </div>

        <!-- Not on GitHub Page -->
        <div id="not-github-section" class="section hidden">
            <svg class="warning-icon" width="48" height="48" viewBox="0 0 16 16" fill="currentColor">
                <path d="M6.457 1.047c.659-1.234 2.427-1.234 3.086 0l6.082 11.378A1.75 1.75 0 0 1 14.082 15H1.918a1.75 1.75 0 0 1-1.543-2.575Zm1.763.707a.25.25 0 0 0-.44 0L1.698 13.132a.25.25 0 0 0 .22.368h12.164a.25.25 0 0 0 .22-.368Zm.53 3.996v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 11a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"></path>
            </svg>
            <p class="warning-text">Please open a GitHub repository page</p>
            <p class="hint-text">Navigate to any GitHub repo and try again</p>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
